# Global defaults; arena geometry and spawns belong only to arenas.yml.
countdown-seconds: 15
round-seconds: 600
respawn-seconds: 5
team-capacity: 8
max-team-difference: 1
min-players: 2
king-health: 30.0
king-type: ZOMBIE
kill-coins: 1
win-coins: 3
max-arena-blocks: 2000000
max-schematic-bytes: 67108864
max-arenas: 16
require-worldguard: true
require-multiverse: false
scoreboard-enabled: true
command-interval-millis: 250
spectator-limit: 16
# Session commands only; help, leave and recovery must remain reachable.
allowed-commands: [siegewar, adsiege, asw]

# Active participants may break terrain. Other plugin denials are still respected.
allow-block-edit: true
regenerate-after-match: true
max-concurrent-resets: 1
max-projectiles-per-player: 32
max-entities-per-arena: 512
kill-reward-cooldown-seconds: 30
reward-minimum-seconds: 10
# These belongings stay in the owner's inventory but cannot function in the arena.
# Use [] to disable this material check. WIND_CHARGE is the vanilla wind projectile.
blacklisted-items: [ELYTRA, WIND_CHARGE, FIREWORK_ROCKET, TRIDENT, ENDER_PEARL, CHORUS_FRUIT, MACE]
blacklisted-effects: [LEVITATION]
database:
  # Embedded local storage only. Paths must stay beneath the plugin data folder.
  path: database/siege
  backup-directory: backup
  pool-size: 4
integrations:
  worldguard: true
  placeholderapi: true
  require-geyser: false
  require-floodgate: false

